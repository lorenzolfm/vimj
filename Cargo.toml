[workspace]
resolver = "3"
members = ["crates/core", "crates/audio", "crates/daemon", "crates/tui"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
dejay-core = { path = "crates/core" }
dejay-audio = { path = "crates/audio" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
dirs = "7"
tracing = "0.1"

# The analysis and time-stretching code is far too slow unoptimised.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.dejay-audio]
opt-level = 3

[profile.test.package.dejay-audio]
opt-level = 3
